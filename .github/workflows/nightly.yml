name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: read

jobs:
  export:
    name: Export ONNX models & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install export dependencies
        run: pip install --quiet -r tools/requirements.txt

      - name: Export YOLO model
        run: python tools/export.py --quantize

      - name: Download MiDaS model
        run: |
          mkdir -p model
          curl -fsSL https://github.com/isl-org/MiDaS/releases/download/v2_1/model-small.onnx \
            -o model/midas_small.onnx

      - name: Run smoke test
        run: |
          pip install --quiet onnxruntime numpy
          python tools/smoke_test.py

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v7
        with:
          name: onnx-models-${{ github.run_id }}
          path: |
            model/yolov8n.onnx
            model/yolov8n_int8.onnx
            model/midas_small.onnx
          retention-days: 30
